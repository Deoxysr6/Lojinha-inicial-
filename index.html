<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Computadores Brasil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1 class="logo">Computadores Brasil</h1>

  <div class="header-direita">
    <div class="login">
      <input type="text" id="usuario" placeholder="Usuário">
      <input type="password" id="senha" placeholder="Senha">
      <button onclick="login()">Entrar</button>
    </div>

    <div class="carrinho-header" onclick="toggleCarrinho()">
      🛒 <span id="contadorCarrinho">0</span>
    </div>
  </div>
</header>

<div class="top-bar">
  🔍 <input type="text" id="busca" placeholder="Buscar produto...">

  📦 
  <select id="filtro">
    <option value="">Selecione uma categoria</option>
    <option value="Hardware">Hardware</option>
    <option value="Cadeiras">Cadeiras</option>
    <option value="Periféricos">Periféricos</option>
    <option value="Computadores">Computadores</option>
  </select>
</div>

<main class="container">
  <div class="produtos" id="listaProdutos"></div>
</main>

<div class="carrinho-box" id="carrinhoBox">

  <div class="carrinho-header-box">
    <h3>🛒 Seu Carrinho</h3>
    <span class="fechar" onclick="toggleCarrinho()">✖</span>
  </div>

  <ul id="listaCarrinho"></ul>

  <div class="carrinho-footer">
    <p id="totalCarrinho">Total: R$ 0,00</p>

    <div class="pagamento-carrinho" id="pagamentoBox">
      <h4>💳 Pagamento</h4>
      <select id="metodo">
        <option>Pix</option>
        <option>Cartão</option>
      </select>
      <button onclick="pagar()">Pagar</button>
    </div>

    <button onclick="abrirPagamento()" class="btnFinalizar">
      Finalizar Compra
    </button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
